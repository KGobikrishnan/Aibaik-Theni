<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="gradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle with shadow -->
  <rect x="35" y="35" width="430" height="430" rx="115" fill="url(#gradIcon)" filter="url(#glow)"/>
  
  <!-- Subtle inner border -->
  <rect x="35" y="35" width="430" height="430" rx="115" fill="none" stroke="white" stroke-width="6" stroke-opacity="0.2" />

  <!-- Voice Waves / Sound Bars with Voice Mic Geometry -->
  <!-- Left accent bar -->
  <rect x="110" y="200" width="28" height="100" rx="14" fill="white" opacity="0.75" />
  <!-- Center-left bar -->
  <rect x="158" y="145" width="28" height="210" rx="14" fill="white" opacity="0.9" />
  
  <!-- Central Soundwave & Star/Sparkle -->
  <!-- Center Main Pill -->
  <rect x="206" y="95" width="28" height="310" rx="14" fill="white" />
  
  <!-- Center-right bar -->
  <rect x="254" y="135" width="28" height="230" rx="14" fill="white" opacity="0.95" />
  <!-- Far right bar 1 -->
  <rect x="302" y="185" width="28" height="130" rx="14" fill="white" opacity="0.85" />
  <!-- Far right bar 2 -->
  <rect x="350" y="225" width="28" height="50" rx="14" fill="white" opacity="0.65" />

  <!-- AI Sparkle on top-right -->
  <path d="M 385 110 Q 385 135 360 135 Q 385 135 385 160 Q 385 135 410 135 Q 385 135 385 110 Z" fill="#FDE047" />
  <circle cx="340" cy="110" r="6" fill="#FDE047" opacity="0.85" />
</svg>