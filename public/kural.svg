<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 352" width="709" height="352">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Container (210x210) centered vertically at y=71 -->
  <g transform="translate(50, 71)" filter="url(#iconShadow)">
    <rect x="0" y="0" width="210" height="210" rx="56" fill="url(#gradBrand)" />
    <rect x="0" y="0" width="210" height="210" rx="56" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.2" />
    
    <!-- Sound Bars inside icon -->
    <rect x="36" y="80" width="14" height="50" rx="7" fill="white" opacity="0.75" />
    <rect x="60" y="52" width="14" height="106" rx="7" fill="white" opacity="0.9" />
    <rect x="84" y="28" width="14" height="154" rx="7" fill="white" />
    <rect x="108" y="48" width="14" height="114" rx="7" fill="white" opacity="0.95" />
    <rect x="132" y="72" width="14" height="66" rx="7" fill="white" opacity="0.85" />
    <rect x="156" y="92" width="14" height="26" rx="7" fill="white" opacity="0.65" />

    <!-- Sparkle on top-right -->
    <path d="M 172 40 Q 172 52 160 52 Q 172 52 172 64 Q 172 52 184 52 Q 172 52 172 40 Z" fill="#FDE047" />
  </g>

  <!-- Right Typography: Kural (குரல்) -->
  <text x="295" y="175" font-family="'Outfit', 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif" font-weight="900" font-size="88" fill="url(#textGrad)" letter-spacing="-1.5">
    Kural
  </text>
  
  <!-- Tamil Name Badge / Accent: குரல் -->
  <g transform="translate(545, 112)">
    <rect x="0" y="0" width="100" height="44" rx="22" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1.5" />
    <text x="50" y="29" font-family="'Noto Sans Tamil', 'Noto Sans Tamil UI', sans-serif" font-weight="700" font-size="21" fill="#7C3AED" text-anchor="middle">
      குரல்
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="298" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#64748B" letter-spacing="0.2">
    Your Customer's Voice
  </text>

  <!-- Small AI Feature Pill -->
  <g transform="translate(298, 245)">
    <rect x="0" y="0" width="215" height="28" rx="14" fill="#EFF6FF" />
    <circle cx="14" cy="14" r="4" fill="#2563EB" />
    <text x="26" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#1D4ED8" letter-spacing="0.5">
      AI GOOGLE REVIEW STUDIO
    </text>
  </g>
</svg>